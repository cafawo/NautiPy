name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

  fix-test:
    name: Test fix extra on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[fix]"
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v

  fix-minimum-dependencies:
    name: Test fix extra minimum dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install exact minimum dependencies
        run: >-
          python -m pip install
          "geographiclib==2.1"
          "numpy==1.23.5"
          "scipy==1.14.1"
      - name: Install NautiPy without re-resolving dependencies
        run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v

  cross-platform-smoke:
    name: Smoke ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install .
      - run: python -c "from nautipy import parse_position; assert parse_position('0, 0').latitude == 0.0"

  cross-platform-fix-smoke:
    name: Fix smoke ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install ".[fix]"
      - run: python -m pip check
      - name: Import models and solve a mixed-observation fix
        run: >-
          python -c "from nautipy import Position, distance, initial_bearing;
          from nautipy.fix import BearingObservation, RangeObservation, solve_fix;
          target = Position(0.01, 0.01);
          stations = (Position(0, 0), Position(0, 0.02), Position(0.02, 0));
          bearings = tuple(BearingObservation(station, initial_bearing(target, station), uncertainty=1.0) for station in stations);
          ranges = tuple(RangeObservation(station, distance(station, target), uncertainty=1.0) for station in stations);
          result = solve_fix(bearings=bearings, ranges=ranges);
          assert result.success;
          assert abs(result.position.latitude - target.latitude) < 1e-8;
          assert abs(result.position.longitude - target.longitude) < 1e-8"

  build:
    name: Build and inspect distributions
    needs:
      - test
      - fix-test
      - fix-minimum-dependencies
      - cross-platform-smoke
      - cross-platform-fix-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/smoke_test_artifact.py dist/*.whl
      - run: python scripts/smoke_test_artifact.py dist/*.tar.gz
      - run: python scripts/smoke_test_artifact.py --fix dist/*.whl
      - run: python scripts/smoke_test_artifact.py --fix dist/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  ci-success:
    name: CI success
    if: ${{ always() }}
    needs:
      - test
      - fix-test
      - fix-minimum-dependencies
      - cross-platform-smoke
      - cross-platform-fix-smoke
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to succeed
        shell: bash
        env:
          TEST_RESULT: ${{ needs.test.result }}
          FIX_RESULT: ${{ needs.fix-test.result }}
          MINIMUM_RESULT: ${{ needs.fix-minimum-dependencies.result }}
          PLATFORM_RESULT: ${{ needs.cross-platform-smoke.result }}
          PLATFORM_FIX_RESULT: ${{ needs.cross-platform-fix-smoke.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          for result in \
            "$TEST_RESULT" \
            "$FIX_RESULT" \
            "$MINIMUM_RESULT" \
            "$PLATFORM_RESULT" \
            "$PLATFORM_FIX_RESULT" \
            "$BUILD_RESULT"
          do
            if [[ "$result" != "success" ]]; then
              exit 1
            fi
          done
