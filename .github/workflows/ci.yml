name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

  fix-test:
    name: Test fix extra on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[fix]"
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v

  fix-minimum-dependencies:
    name: Test fix extra minimum dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install exact minimum dependencies
        run: >-
          python -m pip install
          "geographiclib>=2.1"
          "numpy==1.23.5"
          "scipy==1.14.1"
      - name: Install NautiPy without re-resolving dependencies
        run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v

  cross-platform-smoke:
    name: Smoke ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install .
      - run: python -c "from nautipy import parse_position; assert parse_position('0, 0').latitude == 0.0"

  cross-platform-fix-smoke:
    name: Fix smoke ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install ".[fix]"
      - run: python -m pip check
      - name: Import models and solve a mixed-observation fix
        run: >-
          python -c "from nautipy import Position, distance, initial_bearing;
          from nautipy.fix import BearingObservation, RangeObservation, solve_fix;
          target = Position(0.01, 0.01);
          stations = (Position(0, 0), Position(0, 0.02), Position(0.02, 0));
          bearings = tuple(BearingObservation(station, initial_bearing(target, station), uncertainty=1.0) for station in stations);
          ranges = tuple(RangeObservation(station, distance(station, target), uncertainty=1.0) for station in stations);
          result = solve_fix(bearings=bearings, ranges=ranges);
          assert result.success;
          assert abs(result.position.latitude - target.latitude) < 1e-8;
          assert abs(result.position.longitude - target.longitude) < 1e-8"

  build:
    name: Build and inspect distributions
    needs:
      - test
      - fix-test
      - fix-minimum-dependencies
      - cross-platform-smoke
      - cross-platform-fix-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/smoke_test_artifact.py dist/*.whl
      - run: python scripts/smoke_test_artifact.py dist/*.tar.gz
      - run: python scripts/smoke_test_artifact.py --fix dist/*.whl
      - run: python scripts/smoke_test_artifact.py --fix dist/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
