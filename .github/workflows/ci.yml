name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v

  minimum-dependencies:
    name: Test exact minimum dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install exact minimum dependencies
        run: >-
          python -m pip install
          "geographiclib==2.1"
          "numpy==1.23.5"
          "scipy==1.14.1"
      - name: Install NautiPy without re-resolving dependencies
        run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v

  cross-platform-smoke:
    name: Complete-package smoke ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -m pip check
      - name: Exercise coordinates, navigation, and position fixing
        run: >-
          python -c "from nautipy import
          BearingObservation, Position, RangeObservation, distance,
          initial_bearing, parse_position, solve_fix;
          target = parse_position('0.01, 0.01');
          stations = (Position(0, 0), Position(0, 0.02), Position(0.02, 0));
          bearings = tuple(BearingObservation(station, initial_bearing(target, station), uncertainty=1.0) for station in stations);
          ranges = tuple(RangeObservation(station, distance(station, target), uncertainty=1.0) for station in stations);
          result = solve_fix(bearings=bearings, ranges=ranges);
          assert result.success;
          assert abs(result.position.latitude - target.latitude) < 1e-8;
          assert abs(result.position.longitude - target.longitude) < 1e-8"

  documentation:
    name: Build educational documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            website/requirements.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: python -m pip install --upgrade pip
      - name: Install NautiPy and the pinned documentation toolchain
        run: |
          python -m pip install -e .
          python -m pip install --requirement website/requirements.txt
      - name: Verify generated Fix Lab fixtures
        run: python website/tools/generate_fix_lab.py --check
      - name: Test educational content and assets
        run: python -m unittest discover -s website/tests -v
      - name: Syntax-check interactive documentation
        run: node --check website/content/assets/javascripts/fix-lab.js
      - name: Build the site strictly
        run: >-
          python -m mkdocs build --clean --strict
          --config-file website/mkdocs.yml
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload the GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/site
          retention-days: 1

  build:
    name: Build and inspect distributions
    needs:
      - test
      - minimum-dependencies
      - cross-platform-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/smoke_test_artifact.py dist/*.whl
      - run: python scripts/smoke_test_artifact.py dist/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  ci-success:
    name: CI success
    if: ${{ always() }}
    needs:
      - test
      - minimum-dependencies
      - cross-platform-smoke
      - documentation
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to succeed
        shell: bash
        env:
          TEST_RESULT: ${{ needs.test.result }}
          MINIMUM_RESULT: ${{ needs.minimum-dependencies.result }}
          PLATFORM_RESULT: ${{ needs.cross-platform-smoke.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          for result in \
            "$TEST_RESULT" \
            "$MINIMUM_RESULT" \
            "$PLATFORM_RESULT" \
            "$DOCUMENTATION_RESULT" \
            "$BUILD_RESULT"
          do
            if [[ "$result" != "success" ]]; then
              exit 1
            fi
          done

  deploy-pages:
    name: Deploy educational documentation
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    needs:
      - documentation
      - ci-success
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy the verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
      - name: Verify the custom and GitHub Pages URLs
        shell: bash
        run: |
          for url in \
            "https://wbk.ing/NautiPy/" \
            "https://cafawo.github.io/NautiPy/"
          do
            status="$(
              curl \
                --fail \
                --location \
                --retry 6 \
                --retry-all-errors \
                --retry-delay 10 \
                --show-error \
                --silent \
                --max-time 30 \
                --output /dev/null \
                --write-out "%{http_code}" \
                "$url"
            )"
            if [[ "$status" != "200" ]]; then
              echo "$url returned HTTP $status after redirects" >&2
              exit 1
            fi
          done
