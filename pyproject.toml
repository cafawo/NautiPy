[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nautipy"
version = "0.1.0"
description = "Validated coordinate handling for Python"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
  { name = "CFW", email = "cfw@pm.me" },
]
maintainers = [
  { name = "NautiPy Developers" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/cafawo/NautiPy"
Documentation = "https://github.com/cafawo/NautiPy#readme"
Issues = "https://github.com/cafawo/NautiPy/issues"
Source = "https://github.com/cafawo/NautiPy"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nautipy = ["py.typed"]
