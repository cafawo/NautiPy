site_name: NautiPy
site_description: Learn coordinate formats, WGS84 navigation, and diagnosed position fixing with NautiPy.
site_url: https://wbk.ing/NautiPy/
docs_dir: content
site_dir: site
use_directory_urls: true
strict: true

theme:
  name: material
  language: en
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/nautipy.css

extra_javascript:
  - assets/javascripts/fix-lab.js

nav:
  - Home: index.md
  - Learn:
      - Coordinates on Earth: learn/coordinates.md
      - Navigation on an Ellipsoid: learn/navigation.md
      - Finding the Boat: learn/finding-the-boat.md
      - Can You Trust the Fix?: learn/trusting-a-fix.md
      - Fix Lab: learn/fix-lab.md
  - How NautiPy Works: how-nautipy-works.md
  - Practical Use: practical-use.md
  - Reference:
      - Glossary: reference/glossary.md
      - Further Reading: reference/further-reading.md

